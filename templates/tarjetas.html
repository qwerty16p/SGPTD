<div class="areas">{% for area in areas %}<article><small>{{ area.activo|yesno:"Activo,Inactivo" }}</small><h2>{{ area.nombre }}</h2><p>{{ area.descripcion }}</p><p>{{ area.total }} aplicaciones</p><a href="{% url 'detalle' 'departamentos' area.pk %}" aria-label="Consultar {{ area.nombre }}">Consultar →</a></article>{% empty %}<p>No se encontraron departamentos.</p>{% endfor %}</div>
